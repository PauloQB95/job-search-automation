name: Update job listings

on:
  # Run automatically every day.
  schedule:
    # 13:17 UTC is approximately 8:17 a.m. in Peru.
    - cron: "17 13 * * *"

  # Allow the workflow to be run manually from GitHub.
  workflow_dispatch:

# Prevent two updates from running at the same time.
concurrency:
  group: update-job-listings
  cancel-in-progress: true

# Allow the workflow to create a GitHub Release.
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------
      # 1. Check out the repository
      # ------------------------------------------------------

      - name: Check out repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # ------------------------------------------------------
      # 3. Install dependencies
      # ------------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # ------------------------------------------------------
      # 4. Install Chromium and system dependencies
      # ------------------------------------------------------

      - name: Install Chromium for Playwright
        run: |
          python -m playwright install --with-deps chromium

      # ------------------------------------------------------
      # 5. Run the scrapers
      #
      # If main.py returns exit code 1, the workflow stops here.
      # No Release is created, and the previous one is preserved.
      # ------------------------------------------------------

      - name: Run scrapers
        run: |
          python main.py

      # ------------------------------------------------------
      # 6. Verify that the file exists
      # ------------------------------------------------------

      - name: Verify Excel file
        run: |
          test -f results/consolidated_jobs.xlsx

      # ------------------------------------------------------
      # 7. Create a new Release
      #
      # Each successful run receives a unique tag.
      # ------------------------------------------------------

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="jobs-$(date -u +'%Y%m%d-%H%M%S')"
          DATE="$(date -u +'%Y-%m-%d %H:%M UTC')"

          gh release create "$TAG" \
            results/consolidated_jobs.xlsx \
            --title "Updated job listings - $DATE" \
            --notes "Automatically generated file containing available IDB, World Bank, United Nations System, and Asian Development Bank jobs." \
            --latest
